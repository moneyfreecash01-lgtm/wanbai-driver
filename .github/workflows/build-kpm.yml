name: Build KPM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils

      - name: Download Toolchain
        run: |
          mkdir -p compiler
          curl -L -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz -C compiler --strip-components=1

      - name: Build KPM
        run: |
          chmod +x build-kpm.sh
          bash -x ./build-kpm.sh wanbai-driver ./compiler/bin/aarch64-none-elf-

      - name: Upload KPM
        uses: actions/upload-artifact@v4
        with:
          name: wanbai-kpm
          path: kpms/wanbai-driver/*.kpm
